<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado del Servidor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #f8f9fa;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .contenedor-servidor {
      max-width: 900px;
      border-radius: 12px !important;
      background-color: #ffffff;
    }
    .alerta-personalizada {
      border-radius: 8px !important;
      font-size: 1.05rem;
    }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100 py-5">

  <div class="container">
    <div class="card contenedor-servidor shadow-sm border border-light-subtle p-4 p-md-5 mx-auto">
      <div class="card-body p-0">
        
        <h1 class="fw-bold text-dark mb-1" style="letter-spacing: -0.5px;">Estado del Servidor</h1>
        <p class="text-secondary fs-5 mb-4 opacity-75">Panel de control de servicios activos.</p>
        
        <hr class="text-muted my-4 opacity-25">

        <div class="d-flex flex-column gap-3">
          
          <div class="alert bg-danger text-white border-0 py-3 px-4 m-0 alerta-personalizada">
            <strong>ERROR CRÍTICO:</strong> La base de datos no responde.
          </div>

          <div class="alert bg-warning text-dark border-0 py-3 px-4 m-0 alerta-personalizada" style="background-color: #ffc107 !important;">
            <strong>Aviso:</strong> El espacio en disco está al <span class="text-decoration-underline">90% de su capacidad</span>.
          </div>

          <div class="alert bg-primary text-white border-0 py-3 px-4 m-0 alerta-personalizada" style="background-color: #0d6efd !important;">
            <strong>Sistema:</strong> Todos los demás servicios están OPERATIVOS.
          </div>

        </div>

        <div class="text-center mt-4 pt-3">
          <small class="text-secondary opacity-75">Última actualización: Hace 5 minutos</small>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
