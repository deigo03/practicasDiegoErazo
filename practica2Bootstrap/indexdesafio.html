<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fila Responsiva - Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    /* Estilos personalizados para ver las cajas más bonitas */
    .caja-personalizada {
      background-color: #e3fafc;
      border: 2px solid #1098ad;
      color: #0b7285;
      font-weight: bold;
      border-radius: 5px;
      padding: 20px 10px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .caja-personalizada:hover {
      background-color: #1098ad;
      color: white;
    }
    /* Margen para separar las filas si agregas más */
    .row {
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div class="container my-5">
    
    <h2 class="text-center mb-4"> Rejilla Responsiva (Grid)</h2>
    <p class="text-muted text-center">Prueba a estirar o encoger el ancho de tu navegador para ver cómo se reorganizan las cajas.</p>
    
    <hr>

    <div class="row g-3"> <div class="col-12 col-sm-6 col-md-4 col-lg-2">
        <div class="caja-personalizada">Caja 1</div>
      </div>

      <div class="col-12 col-sm-6 col-md-4 col-lg-2">
        <div class="caja-personalizada">Caja 2</div>
      </div>

      <div class="col-12 col-sm-2 col-md-4 col-lg-2">
        <div class="caja-personalizada">Caja 3</div>
      </div>

      <div class="col-12 col-sm-2 col-md-4 col-lg-2">
        <div class="caja-personalizada">Caja 4</div>
      </div>

      <div class="col-12 col-sm-2 col-md-4 col-lg-2">
        <div class="caja-personalizada">Caja 5</div>
      </div>

      <div class="col-12 col-sm-2 col-md-4 col-lg-2">
        <div class="caja-personalizada">Caja 6</div>
      </div>

    </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
